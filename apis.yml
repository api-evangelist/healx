aid: healx
name: Healx
description: >-
  Healx is a Cambridge, UK clinical-stage biotechnology company that uses
  artificial intelligence to discover and develop new treatments for rare
  diseases. Its Healnet platform pairs generative AI with drug-discovery and
  rare-disease expertise to build a biomedical knowledge graph from public and
  proprietary sources - biomedical literature, disease and biochemical datasets,
  clinical trials and patents - and to identify novel uses for known compounds.
  Founded by David Brown and Tim Guilliams, Healx advances its own therapeutic
  pipeline (including its NF1 lead candidate HLX-1502) and partners with pharma
  companies such as Sanofi. Healx does not currently publish a public developer
  API; this profile tracks its identity and public web surface in the API
  Evangelist network.
